name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -E 'androiddebugkey|SHA-256'
            # The runner sets XDG_CONFIG_HOME, so AGP would look for the debug keystore there instead.
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
            echo "EXPECTED_CERT_SHA256=$(keytool -exportcert -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with the stored key: installs over previous builds signed with the same key." >> "$GITHUB_ENV"
          else
            echo "SIGNING_NOTE=Signed with a throwaway key: uninstall the previous Winlator DL before installing." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null

      - name: Build
        run: bash gradlew --no-daemon assembleDebug

      - name: Check signing key
        if: env.EXPECTED_CERT_SHA256 != ''
        run: |
          ACTUAL=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "expected ${EXPECTED_CERT_SHA256}"
          echo "actual   ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED_CERT_SHA256}" ]; then
            echo "::error::APK is not signed with the stored key"
            exit 1
          fi

      - name: Name the APK
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk "WinlatorDL-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinlatorDL-build${{ github.run_number }}
          path: WinlatorDL-*.apk
          if-no-files-found: error
