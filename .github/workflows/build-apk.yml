name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is missing; without it updates would not install over the previous APK."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null

      - name: Build
        run: bash gradlew --no-daemon assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle)
          NAME="WinlatorDL-${VERSION}-build${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "${NAME}.apk"
          gh release create "build-${GITHUB_RUN_NUMBER}" "${NAME}.apk" \
            --target "${GITHUB_SHA}" \
            --title "Winlator DL ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_SHA}"
