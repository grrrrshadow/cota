name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -E 'androiddebugkey|SHA-256'
            echo "SIGNING_NOTE=Signed with the stored key: installs over previous builds signed with the same key." >> "$GITHUB_ENV"
          else
            echo "SIGNING_NOTE=Signed with a throwaway key: uninstall the previous Winlator DL before installing." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null

      - name: Build
        run: bash gradlew --no-daemon assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle)
          TAG="build-${GITHUB_RUN_NUMBER}"
          NAME="WinlatorDL-${VERSION}-build${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "${NAME}.apk"
          NOTES="Built from ${GITHUB_SHA}. ${SIGNING_NOTE}"
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            gh release create "${TAG}" --target "${GITHUB_SHA}" \
              --title "Winlator DL ${VERSION} (build ${GITHUB_RUN_NUMBER})" --notes "${NOTES}"
          fi
          gh release upload "${TAG}" "${NAME}.apk" --clobber
